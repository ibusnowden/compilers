<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img">
<title>Flash attention: never write the T×T matrix</title>
<rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="#ffffff" stroke="#e3e6eb"/>
<defs><marker id="m5b6474" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker></defs>
<text x="24.0" y="40.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#1f2430" text-anchor="start">Flash attention: never write the T×T matrix</text>
<text x="24.0" y="66.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">for one block of queries, stream over blocks of keys/values, keeping a running max m, sum ℓ and output O in registers</text>
<rect x="40.0" y="110.0" width="120.0" height="90.0" rx="8" fill="#e8effc" stroke="#3b6fd8" stroke-width="1.5" opacity="1"/>
<text x="100.0" y="151.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="500" fill="#1d3f8f" text-anchor="middle">Q block</text>
<text x="100.0" y="168.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">Br × d</text>
<rect x="220.0" y="110.0" width="80.0" height="90.0" rx="8" fill="#e5f5ec" stroke="#2e9e6a" stroke-width="1.5" opacity="1"/>
<text x="260.0" y="151.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="500" fill="#165c3b" text-anchor="middle">K0, V0</text>
<text x="260.0" y="168.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">Bc × d</text>
<rect x="310.0" y="110.0" width="80.0" height="90.0" rx="8" fill="#e5f5ec" stroke="#2e9e6a" stroke-width="1.5" opacity="1"/>
<text x="350.0" y="151.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="500" fill="#165c3b" text-anchor="middle">K1, V1</text>
<text x="350.0" y="168.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">Bc × d</text>
<rect x="400.0" y="110.0" width="80.0" height="90.0" rx="8" fill="#e2f4f4" stroke="#2a9d9d" stroke-width="1.5" opacity="1"/>
<text x="440.0" y="151.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="500" fill="#145757" text-anchor="middle">K2, V2</text>
<text x="440.0" y="168.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">Bc × d</text>
<rect x="490.0" y="110.0" width="80.0" height="90.0" rx="8" fill="#e5f5ec" stroke="#2e9e6a" stroke-width="1.5" opacity="1"/>
<text x="530.0" y="151.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="500" fill="#165c3b" text-anchor="middle">K3, V3</text>
<text x="530.0" y="168.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">Bc × d</text>
<line x1="160.0" y1="155.0" x2="218.0" y2="155.0" stroke="#5b6474" stroke-width="1.6" marker-end="url(#m5b6474)"/>
<text x="400.0" y="228.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">stream j = 0, 1, 2, … (only one K/V block in SRAM at a time)</text>
<rect x="40.0" y="250.0" width="560.0" height="168.0" rx="8" fill="#fbfbfd" stroke="#2a9d9d" stroke-width="1.5" opacity="1"/>
<text x="52.0" y="271.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="600" fill="#6b7280" text-anchor="start">online softmax, per key block</text>
<text x="52.0" y="297.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">S   = Q · Kjᵀ · (1/√d)          # Br × Bc, registers only</text>
<rect x="44.0" y="302.0" width="552.0" height="18.0" rx="3" fill="#efeafa" stroke="#efeafa" stroke-width="0" opacity="1"/>
<text x="52.0" y="315.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">m&#x27;  = max(m, rowmax(S))</text>
<text x="52.0" y="333.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">P   = exp(S − m&#x27;)</text>
<rect x="44.0" y="338.0" width="552.0" height="18.0" rx="3" fill="#efeafa" stroke="#efeafa" stroke-width="0" opacity="1"/>
<text x="52.0" y="351.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">ℓ   = ℓ · exp(m − m&#x27;) + rowsum(P)</text>
<rect x="44.0" y="356.0" width="552.0" height="18.0" rx="3" fill="#efeafa" stroke="#efeafa" stroke-width="0" opacity="1"/>
<text x="52.0" y="369.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">O   = O · exp(m − m&#x27;) + P · Vj</text>
<text x="52.0" y="387.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">m   = m&#x27;</text>
<text x="52.0" y="405.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start"># after the last block:  O = O / ℓ   (one store)</text>
<rect x="640.0" y="110.0" width="310.0" height="330.0" rx="10" fill="#fbfbfd" stroke="#e3e6eb" stroke-width="1.5" opacity="1"/>
<text x="660.0" y="139.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="700" fill="#1f2430" text-anchor="start">why it&#x27;s exact</text>
<text x="660.0" y="165.8" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">softmax(x)ᵢ = exp(xᵢ − m) / Σ exp(xⱼ − m)</text>
<text x="660.0" y="189.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">holds for ANY m. When a new block raises</text>
<text x="660.0" y="207.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">the max from m to m&#x27;, rescale what you</text>
<text x="660.0" y="225.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">already summed by exp(m − m&#x27;).</text>
<text x="660.0" y="262.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="600" fill="#145757" text-anchor="start">memory:  O(T·d)  instead of  O(T²)</text>
<text x="660.0" y="287.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">HBM traffic: Q, K, V read once per</text>
<text x="660.0" y="305.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">query block; S and P never leave the SM</text>
<text x="660.0" y="341.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">causal: skip key blocks entirely above</text>
<text x="660.0" y="359.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">the diagonal (≈ 2× fewer FLOPs)</text>
<text x="660.0" y="395.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#45297f" text-anchor="start">in uc: it&#x27;s a reduce whose accumulator is</text>
<text x="660.0" y="413.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#45297f" text-anchor="start">the tuple (m, ℓ, O) — a custom combine.</text>
</svg>
