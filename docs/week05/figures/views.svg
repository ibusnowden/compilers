<text x="60.0" y="294.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="700" fill="#6b7280" text-anchor="start">permute [1 0]</text>
<rect x="60.0" y="302.0" width="40.0" height="40.0" rx="0" fill="#efeafa" stroke="#b8c0cc" stroke-width="1" opacity="1"/>
