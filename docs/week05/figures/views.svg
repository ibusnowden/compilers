<text x="120.0" y="325.9" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="middle">3</text>
<rect x="60.0" y="342.0" width="40.0" height="40.0" rx="0" fill="#efeafa" stroke="#b8c0cc" stroke-width="1" opacity="1"/>
