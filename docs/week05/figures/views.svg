<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450" role="img">
<title>Movement ops are index arithmetic</title>
<rect x="0.5" y="0.5" width="979" height="449" rx="14" fill="#ffffff" stroke="#e3e6eb"/>
<text x="24.0" y="40.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#1f2430" text-anchor="start">Movement ops are index arithmetic</text>
<text x="24.0" y="66.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">nothing moves: each op rewrites the index expression used to LOAD from the original buffer</text>
<text x="60.0" y="104.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="700" fill="#6b7280" text-anchor="start">buffer (6 elements)</text>
