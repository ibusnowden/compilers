<rect x="60.0" y="227.0" width="40.0" height="40.0" rx="0" fill="#e8effc" stroke="#b8c0cc" stroke-width="1" opacity="1"/>
<text x="80.0" y="250.8" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="middle">3</text>
