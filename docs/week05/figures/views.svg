<rect x="100.0" y="382.0" width="40.0" height="40.0" rx="0" fill="#efeafa" stroke="#b8c0cc" stroke-width="1" opacity="1"/>
<text x="120.0" y="405.9" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="middle">5</text>
<rect x="330.0" y="100.0" width="620.0" height="240.0" rx="8" fill="#fbfbfd" stroke="#3b6fd8" stroke-width="1.5" opacity="1"/>
<text x="342.0" y="121.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="600" fill="#6b7280" text-anchor="start">the index expression each view produces</text>
<text x="342.0" y="147.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">out[i]     = buf[i]</text>
<text x="342.0" y="165.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start"></text>
<text x="342.0" y="183.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">reshape:   v[i, j]   = buf[i*3 + j]</text>
<rect x="334.0" y="188.0" width="612.0" height="18.0" rx="3" fill="#efeafa" stroke="#efeafa" stroke-width="0" opacity="1"/>
<text x="342.0" y="201.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">permute:   t[i, j]   = v[j, i]          = buf[j*3 + i]</text>
<rect x="334.0" y="206.0" width="612.0" height="18.0" rx="3" fill="#efeafa" stroke="#efeafa" stroke-width="0" opacity="1"/>
<text x="342.0" y="219.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">reshape:   f[k]      = t[k / 2, k % 2]  = buf[(k % 2)*3 + k / 2]</text>
<text x="342.0" y="237.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start"></text>
<text x="342.0" y="255.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">pad [[1 1]]:     p[i] = valid(i) ? buf[i - 1] : 0,</text>
<text x="342.0" y="273.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">                 valid(i) = 1 ≤ i  &amp;&amp;  i &lt; 7</text>
<text x="342.0" y="291.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">shrink [[2 5]]:  s[i] = buf[i + 2]</text>
<text x="342.0" y="309.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">flip [0]:        r[i] = buf[5 - i]</text>
<text x="342.0" y="327.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">expand [6 4]:    e[i, j] = buf[i]          (j is ignored)</text>
<text x="640.0" y="376.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="400" fill="#45297f" text-anchor="middle">(i*3 + j)/3 → i  and  (i*3 + j)%3 → j  are week-1 rule 5:</text>
<text x="640.0" y="396.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="400" fill="#45297f" text-anchor="middle">a reshape round-trip simplifies away, so it costs nothing</text>
</svg>
