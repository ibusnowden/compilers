<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img">
<title>pad is a guarded load</title>
<rect x="0.5" y="0.5" width="979" height="299" rx="14" fill="#ffffff" stroke="#e3e6eb"/>
<text x="24.0" y="40.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#1f2430" text-anchor="start">pad is a guarded load</text>
<text x="24.0" y="66.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">pad [1 2 3] [[1 2]]  →  [0 1 2 3 0 0]</text>
<rect x="70.0" y="120.0" width="46.0" height="46.0" rx="0" fill="#f1f3f6" stroke="#b8c0cc" stroke-width="1" opacity="1"/>
