<line x1="385.0" y1="132.0" x2="425.0" y2="132.0" stroke="#5b6474" stroke-width="1.6" marker-end="url(#m5b6474)"/>
<rect x="635.0" y="110.0" width="170.0" height="44.0" rx="8" fill="#e5f5ec" stroke="#2e9e6a" stroke-width="1.5" opacity="1"/>
<text x="720.0" y="136.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="500" fill="#165c3b" text-anchor="middle">b3 = store b2 1 7</text>
<line x1="595.0" y1="132.0" x2="635.0" y2="132.0" stroke="#5b6474" stroke-width="1.6" marker-end="url(#m5b6474)"/>
<rect x="220.0" y="215.0" width="160.0" height="36.0" rx="8" fill="#e8effc" stroke="#3b6fd8" stroke-width="1.5" opacity="1"/>
<text x="300.0" y="237.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="500" fill="#1d3f8f" text-anchor="middle">load b1 0  → 1</text>
<line x1="300.0" y1="210.0" x2="300.0" y2="156.0" stroke="#2e9e6a" stroke-width="1.6" marker-end="url(#m2e9e6a)"/>
<rect x="430.0" y="215.0" width="160.0" height="36.0" rx="8" fill="#e8effc" stroke="#3b6fd8" stroke-width="1.5" opacity="1"/>
<text x="510.0" y="237.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="500" fill="#1d3f8f" text-anchor="middle">load b2 0  → 2</text>
<line x1="510.0" y1="210.0" x2="510.0" y2="156.0" stroke="#2e9e6a" stroke-width="1.6" marker-end="url(#m2e9e6a)"/>
<rect x="10.0" y="215.0" width="160.0" height="36.0" rx="8" fill="#e8effc" stroke="#3b6fd8" stroke-width="1.5" opacity="1"/>
