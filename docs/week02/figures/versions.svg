<line x1="90.0" y1="210.0" x2="90.0" y2="156.0" stroke="#2e9e6a" stroke-width="1.6" marker-end="url(#m2e9e6a)"/>
<rect x="60.0" y="290.0" width="860.0" height="50.0" rx="8" fill="#fbfbfd" stroke="#e3e6eb" stroke-width="1.5" opacity="1"/>
<text x="490.0" y="309.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="600" fill="#1f2430" text-anchor="middle">Physically there is ONE allocation, mutated in place.</text>
<text x="490.0" y="330.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">So every load of version v must run before the store that overwrites v (write-after-read).</text>
</svg>
