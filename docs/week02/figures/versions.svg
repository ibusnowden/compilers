<text x="24.0" y="40.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#1f2430" text-anchor="start">Memory is versioned</text>
<text x="24.0" y="66.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">store returns a NEW version; loads name the version they read</text>
<rect x="5.0" y="110.0" width="170.0" height="44.0" rx="8" fill="#e5f5ec" stroke="#2e9e6a" stroke-width="1.5" opacity="1"/>
<text x="90.0" y="136.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="500" fill="#165c3b" text-anchor="middle">b0 = buffer i32 4</text>
<rect x="215.0" y="110.0" width="170.0" height="44.0" rx="8" fill="#e5f5ec" stroke="#2e9e6a" stroke-width="1.5" opacity="1"/>
<text x="300.0" y="136.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="500" fill="#165c3b" text-anchor="middle">b1 = store b0 0 1</text>
<line x1="175.0" y1="132.0" x2="215.0" y2="132.0" stroke="#5b6474" stroke-width="1.6" marker-end="url(#m5b6474)"/>
