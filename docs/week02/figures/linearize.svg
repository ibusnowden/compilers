<rect x="140.0" y="145.0" width="100.0" height="30.0" rx="15.0" fill="#e5f5ec" stroke="#2e9e6a" stroke-width="1.5" opacity="1"/>
<text x="190.0" y="164.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="500" fill="#165c3b" text-anchor="middle">STORE b2</text>
<rect x="75.0" y="75.0" width="90.0" height="30.0" rx="15.0" fill="#f1f3f6" stroke="#9aa3b2" stroke-width="1.5" opacity="1"/>
<text x="120.0" y="94.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="500" fill="#384152" text-anchor="middle">ASSERT</text>
