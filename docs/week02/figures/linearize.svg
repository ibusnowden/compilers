<rect x="70.0" y="220.0" width="100.0" height="30.0" rx="15.0" fill="#e5f5ec" stroke="#2e9e6a" stroke-width="1.5" opacity="1"/>
<text x="120.0" y="239.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="500" fill="#165c3b" text-anchor="middle">STORE b1</text>
<rect x="15.0" y="145.0" width="90.0" height="30.0" rx="15.0" fill="#e8effc" stroke="#3b6fd8" stroke-width="1.5" opacity="1"/>
