<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img">
<title>Linearize: graph → ordered list</title>
<rect x="0.5" y="0.5" width="979" height="379" rx="14" fill="#ffffff" stroke="#e3e6eb"/>
