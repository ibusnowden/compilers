<text x="96.0" y="283.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="600" fill="#8a4a0b" text-anchor="end">k  (reduce)</text>
<text x="368.0" y="341.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="600" fill="#8a4a0b" text-anchor="start">i  (output)</text>
<text x="206.0" y="420.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#1d3f8f" text-anchor="middle">blue column: all k for one (i, j) = one C[i, j]</text>
<rect x="530.0" y="92.0" width="420.0" height="114.0" rx="8" fill="#fbfbfd" stroke="#e08a2c" stroke-width="1.5" opacity="1"/>
<text x="542.0" y="113.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="600" fill="#6b7280" text-anchor="start">the week-3 loop nest</text>
<text x="542.0" y="139.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">for i in range(M):        # output</text>
<text x="542.0" y="157.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">  for j in range(N):      # output</text>
<text x="542.0" y="175.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">    for k in range(K):    # reduce</text>
<text x="542.0" y="193.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">      C[i*N+j] += A[i*K+k] * B[k*N+j]</text>
<text x="740.0" y="254.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="600" fill="#1f2430" text-anchor="middle">M·N·K multiply-adds,  M·N outputs</text>
<text x="740.0" y="279.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">every (i, j) column is independent → parallel</text>
<text x="740.0" y="301.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">every k step depends on the last → sequential</text>
<text x="740.0" y="334.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">week 4 moves the += into a register;</text>
<text x="740.0" y="354.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">weeks 7–9 tile all three axes for caches and tensor cores</text>
</svg>
