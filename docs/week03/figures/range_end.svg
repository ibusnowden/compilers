<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380">
<rect x="0.5" y="0.5" width="979" height="379" rx="14" fill="#ffffff" stroke="#e3e6eb"/>
<defs><marker id="me08a2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a2c"/></marker></defs>
<text x="24.0" y="40.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#1f2430" text-anchor="start">range and end become a loop</text>
<text x="24.0" y="66.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">the chain closed by `end` is the loop body; everything else is placed as far out as it can go</text>
<rect x="30.0" y="92.0" width="370.0" height="150.0" rx="8" fill="#fbfbfd" stroke="#e08a2c" stroke-width="1.5" opacity="1"/>
<text x="42.0" y="113.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="600" fill="#6b7280" text-anchor="start">UIR</text>
<text x="42.0" y="139.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">%k = buffer i32 [7]</text>
<text x="42.0" y="157.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">%o = buffer i32 16</text>
<rect x="34.0" y="162.0" width="362.0" height="18.0" rx="3" fill="#fdf0e1" stroke="#fdf0e1" stroke-width="0" opacity="1"/>
<text x="42.0" y="175.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">%i = range 16</text>
<text x="42.0" y="193.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">%v = add %i (mul (load %k 0) 3)</text>
<text x="42.0" y="211.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">%s = store %o %i %v</text>
<rect x="34.0" y="216.0" width="362.0" height="18.0" rx="3" fill="#fdf0e1" stroke="#fdf0e1" stroke-width="0" opacity="1"/>
<text x="42.0" y="229.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">%o1 = end %s %i</text>
<line x1="410.0" y1="180.0" x2="470.0" y2="180.0" stroke="#e08a2c" stroke-width="1.6" marker-end="url(#me08a2c)"/>
<text x="440.0" y="155.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">linearize</text>
<text x="440.0" y="167.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="middle">+ render</text>
<rect x="480.0" y="92.0" width="470.0" height="150.0" rx="8" fill="#fbfbfd" stroke="#e08a2c" stroke-width="1.5" opacity="1"/>
<text x="492.0" y="113.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="600" fill="#6b7280" text-anchor="start">C</text>
<text x="492.0" y="139.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">void kernel(int* restrict k, int* restrict o) {</text>
<rect x="484.0" y="144.0" width="462.0" height="18.0" rx="3" fill="#efeafa" stroke="#efeafa" stroke-width="0" opacity="1"/>
<text x="492.0" y="157.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">  int c = k[0] * 3;            // hoisted: no %i</text>
<rect x="484.0" y="162.0" width="462.0" height="18.0" rx="3" fill="#fdf0e1" stroke="#fdf0e1" stroke-width="0" opacity="1"/>
<text x="492.0" y="175.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">  for (int i = 0; i &lt; 16; i++) {</text>
<rect x="484.0" y="180.0" width="462.0" height="18.0" rx="3" fill="#e5f5ec" stroke="#e5f5ec" stroke-width="0" opacity="1"/>
<text x="492.0" y="193.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">    o[i] = i + c;</text>
<text x="492.0" y="211.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">  }</text>
<text x="492.0" y="229.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">}</text>
<rect x="480.0" y="300.0" width="14.0" height="14.0" rx="3" fill="#efeafa" stroke="#7c5cc4" stroke-width="1.5" opacity="1"/>
<text x="502.0" y="310.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">loop-invariant: depends on no range → outside</text>
<rect x="480.0" y="320.0" width="14.0" height="14.0" rx="3" fill="#fdf0e1" stroke="#e08a2c" stroke-width="1.5" opacity="1"/>
<text x="502.0" y="330.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">the range opens a loop; end closes it</text>
<rect x="480.0" y="340.0" width="14.0" height="14.0" rx="3" fill="#e5f5ec" stroke="#2e9e6a" stroke-width="1.5" opacity="1"/>
<text x="502.0" y="350.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">the store chain: runs every iteration</text>
</svg>
