<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img">
<title>To materialize or to recompute?</title>
<rect x="0.5" y="0.5" width="979" height="399" rx="14" fill="#ffffff" stroke="#e3e6eb"/>
<text x="24.0" y="40.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" xml:space="preserve" font-weight="700" fill="#1f2430" text-anchor="start">To materialize or to recompute?</text>
<text x="24.0" y="66.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">y = x − max(x):  the scalar max(x) is needed by every element</text>
<text x="250.0" y="96.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" xml:space="preserve" font-weight="700" fill="#8a4a0b" text-anchor="middle">fuse: 1 kernel, O(n²) work</text>
<rect x="40.0" y="108.0" width="420.0" height="110.0" rx="8" fill="#fbfbfd" stroke="#e08a2c" stroke-width="1.5" opacity="1"/>
<text x="52.0" y="133.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">for i in range(n):            # output</text>
<text x="52.0" y="151.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">  m = -inf</text>
<rect x="44.0" y="156.0" width="412.0" height="18.0" rx="3" fill="#fbe9e9" stroke="#fbe9e9" stroke-width="0" opacity="1"/>
<text x="52.0" y="169.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">  for r in range(n):          # reduce, again</text>
<rect x="44.0" y="174.0" width="412.0" height="18.0" rx="3" fill="#fbe9e9" stroke="#fbe9e9" stroke-width="0" opacity="1"/>
<text x="52.0" y="187.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">    m = max(m, x[r])</text>
<text x="52.0" y="205.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">  y[i] = x[i] - m</text>
<text x="730.0" y="96.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" xml:space="preserve" font-weight="700" fill="#165c3b" text-anchor="middle">materialize: 2 kernels, O(n) work</text>
<rect x="520.0" y="108.0" width="420.0" height="128.0" rx="8" fill="#fbfbfd" stroke="#2e9e6a" stroke-width="1.5" opacity="1"/>
<text x="532.0" y="133.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start"># kernel 1</text>
<text x="532.0" y="151.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">m = -inf</text>
<text x="532.0" y="169.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">for r in range(n): m = max(m, x[r])</text>
<rect x="524.0" y="174.0" width="412.0" height="18.0" rx="3" fill="#e5f5ec" stroke="#e5f5ec" stroke-width="0" opacity="1"/>
<text x="532.0" y="187.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">M[0] = m                      # buffer</text>
<text x="532.0" y="205.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start"># kernel 2</text>
<text x="532.0" y="223.2" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" xml:space="preserve" font-weight="400" fill="#1f2430" text-anchor="start">for i in range(n): y[i] = x[i] - M[0]</text>
<rect x="40.0" y="256.0" width="900.0" height="120.0" rx="10" fill="#fbfbfd" stroke="#e3e6eb" stroke-width="1.5" opacity="1"/>
<text x="60.0" y="285.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" xml:space="preserve" font-weight="700" fill="#1f2430" text-anchor="start">A workable default policy (week 4):</text>
<text x="60.0" y="312.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">• materialize a REDUCE whose result is EXPANDed (used by more outputs than it has elements)</text>
<text x="60.0" y="334.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">• materialize anything marked contiguous, and every program output</text>
<text x="60.0" y="356.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" xml:space="preserve" font-weight="400" fill="#6b7280" text-anchor="start">• fuse everything else: elementwise ops and movement ops are always free to recompute</text>
</svg>
