[pytest]
# perf tests need quiet hardware, so they are off by default.  Run them with:  pytest tests/week07 -m perf -s
addopts = -m "not perf"
markers =
    perf: performance thresholds (need quiet hardware; run separately)
    slow: needs downloads or minutes of compute
    models: needs your model code in compiler/uc/models (also under UC_TORCH_SHIM=1)
